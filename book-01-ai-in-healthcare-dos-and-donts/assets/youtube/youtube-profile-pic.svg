<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2447"/>
      <stop offset="1" stop-color="#1F6F78"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1C5"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD1C5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="176" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="300" fill="url(#glow)"/>

  <g transform="translate(400,360)">
    <rect x="-150" y="-34" width="300" height="68" rx="14" fill="url(#accent)"/>
    <rect x="-34" y="-150" width="68" height="300" rx="14" fill="url(#accent)"/>
  </g>

  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <polyline points="280,470 360,470 400,420 440,520 470,470 520,470" stroke-width="14"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="400" y="610" font-size="56" font-weight="bold" fill="#FFFFFF">Practical AI</text>
    <text x="400" y="678" font-size="34" fill="#4FD1C5" letter-spacing="4">HEALTHCARE</text>
  </g>
</svg>