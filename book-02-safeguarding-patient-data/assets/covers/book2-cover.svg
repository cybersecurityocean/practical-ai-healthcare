<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1B2A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E5CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="2560" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1400" cy="200" r="300" fill="#00BFA5" opacity="0.05"/>
  <circle cx="200" cy="2400" r="400" fill="#00BFA5" opacity="0.03"/>
  <circle cx="800" cy="1280" r="600" fill="#00BFA5" opacity="0.02"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1600" height="8" fill="url(#tealAccent)"/>

  <!-- Series label -->
  <text x="800" y="200" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#00BFA5" text-anchor="middle" letter-spacing="8" font-weight="400">PRACTICAL AI IN HEALTHCARE</text>

  <!-- Teal line under series -->
  <rect x="600" y="220" width="400" height="3" fill="#00BFA5" rx="1.5"/>

  <!-- Shield / lock icon (representing data protection) -->
  <g transform="translate(800, 500)">
    <path d="M0-120 L100-80 L100,40 C100,100 50,140 0,160 C-50,140 -100,100 -100,40 L-100-80 Z" fill="none" stroke="#00BFA5" stroke-width="4" opacity="0.6"/>
    <rect x="-30" y="-20" width="60" height="50" rx="8" fill="none" stroke="#00BFA5" stroke-width="3" opacity="0.5"/>
    <circle cx="0" cy="-30" r="12" fill="none" stroke="#00BFA5" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="-18" x2="0" y2="0" stroke="#00BFA5" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Book number -->
  <text x="800" y="720" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#00BFA5" text-anchor="middle" letter-spacing="4" font-weight="300">BOOK 2</text>

  <!-- Main title -->
  <text x="800" y="900" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#FFFFFF" text-anchor="middle" font-weight="700">Safeguarding</text>
  <text x="800" y="1020" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#FFFFFF" text-anchor="middle" font-weight="700">Confidential</text>
  <text x="800" y="1140" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#FFFFFF" text-anchor="middle" font-weight="700">Patient Data</text>

  <!-- Teal accent line -->
  <rect x="500" y="1180" width="600" height="4" fill="url(#tealAccent)" rx="2"/>

  <!-- Subtitle -->
  <text x="800" y="1280" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#00BFA5" text-anchor="middle" font-weight="400">in the Age of AI</text>

  <!-- Description -->
  <text x="800" y="1420" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#FFFFFF" text-anchor="middle" opacity="0.7">A Plain-Language Guide to Data Privacy,</text>
  <text x="800" y="1470" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#FFFFFF" text-anchor="middle" opacity="0.7">Consent, and Compliance for AI in Healthcare</text>

  <!-- Key topics boxes -->
  <g transform="translate(200, 1580)">
    <rect x="0" y="0" width="340" height="80" rx="8" fill="#00BFA5" opacity="0.15"/>
    <text x="170" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#00BFA5" text-anchor="middle">DPDP Act 2023</text>
  </g>
  <g transform="translate(630, 1580)">
    <rect x="0" y="0" width="340" height="80" rx="8" fill="#00BFA5" opacity="0.15"/>
    <text x="170" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#00BFA5" text-anchor="middle">HIPAA</text>
  </g>
  <g transform="translate(1060, 1580)">
    <rect x="0" y="0" width="340" height="80" rx="8" fill="#00BFA5" opacity="0.15"/>
    <text x="170" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#00BFA5" text-anchor="middle">GDPR</text>
  </g>

  <!-- Bottom section -->
  <rect x="0" y="2300" width="1600" height="260" fill="#0D1B2A" opacity="0.5"/>

  <!-- Author name -->
  <text x="800" y="2400" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#FFFFFF" text-anchor="middle" font-weight="600">Mohammed Imthiyaz A</text>

  <!-- Author credentials -->
  <text x="800" y="2460" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#00BFA5" text-anchor="middle" opacity="0.8">Senior QA &amp; Business Analyst | 10+ Years Healthcare IT | 150+ Hospitals</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="2552" width="1600" height="8" fill="url(#tealAccent)"/>
</svg>